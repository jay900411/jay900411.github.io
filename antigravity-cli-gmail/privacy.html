    <h2>處理的資料</h2>
    <p>依使用者授權，處理提供功能所需的 Gmail 郵件與 Google Calendar 行事曆資料。</p>
    <h2>資料用途與分享</h2>
    <p>資料用於郵件整理、寄信及行程管理。為完成使用者要求，必要內容可能交由使用者選用的 AI 服務處理。本工具不出售這些資料，也不將其用於廣告。</p>
    <h2>紀錄與使用者控制</h2>
    <p>應用程式可能保留執行功能所需的紀錄。使用者可停止使用、在 Google 帳號設定中撤銷授權，並管理或刪除已保留的紀錄。撤銷授權不會自動刪除既有紀錄。</p>
    <footer>本網站僅提供說明，不公開郵件或行事曆內容。</footer>
